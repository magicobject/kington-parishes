# Daily vulnerability watch — see scripts/vuln-watch.mjs, the "Daily
# vulnerability watch" section of README.md, and the plain-English note on
# /help-technical-details.html. Every morning it checks every
# installed package against the GitHub Advisory Database and OSV, opens one
# `security-advisory` issue per advisory, and fails the run (so GitHub emails
# the owner) on anything high or critical. It never changes code itself.
#
# Actions are pinned to exact commits, not tags — a moved tag can't slip new
# code into this workflow. Dependabot (.github/dependabot.yml) proposes
# updates to these pins.
name: Vulnerability watch

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC daily; off the hour to avoid GitHub's busiest minute
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vuln-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # --ignore-scripts: the watch only needs the lockfile resolved, and a
      # compromised package's install script is exactly what it's looking for.
      - run: npm ci --ignore-scripts
      - run: node scripts/vuln-watch.mjs
        env:
          GH_TOKEN: ${{ github.token }}
