  <rect x="70" y="200" width="760" height="320" rx="14" fill="none" stroke="#7C5E28" stroke-opacity="0.25" stroke-width="2"/>

  <!-- ================= intro copy ================= -->
  <g font-family="'Public Sans', Arial, sans-serif" font-size="26" fill="#262521">
    <text x="70" y="590">Every week, local businesses in Kington donate surplus</text>
    <text x="70" y="626">food that would otherwise go to waste. We’re making it</text>
    <text x="70" y="662">available — completely free — to anyone who wants it.</text>
  </g>

  <g font-family="Spectral, Georgia, serif" font-size="28" font-weight="600" font-style="italic" fill="#5E4657" text-anchor="middle">
    <text x="450" y="734">This isn’t a food bank. It’s a community effort</text>
    <text x="450" y="772">to reduce waste.</text>
  </g>

  <line x1="70" y1="816" x2="830" y2="816" stroke="#A8813C" stroke-width="2" opacity="0.35"/>

  <g font-family="'Public Sans', Arial, sans-serif" font-size="26" fill="#262521">
    <text x="70" y="872">Whether you’re passing by, feeding a family, or just</text>
    <text x="70" y="908">fancy a loaf of bread or a bag of veg — come and take</text>
    <text x="70" y="944">what you’ll use. No forms, no questions, no stigma.</text>
