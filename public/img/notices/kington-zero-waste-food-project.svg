<svg viewBox="0 0 900 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kzwfp-title kzwfp-desc">
  <title id="kzwfp-title">Kington Zero Waste Food Project — weekly on Mondays &amp; Fridays</title>
  <desc id="kzwfp-desc">Every week, local businesses in Kington donate surplus food that would otherwise go to waste. We’re making it available, completely free, to anyone who wants it. This isn’t a food bank. It’s a community effort to reduce waste. Whether you’re passing by, feeding a family, or just fancy a loaf of bread or a bag of veg, come and take what you’ll use. No forms, no questions, no stigma. St Mary’s Parish Hall. Fridays 10:00 to 11:00. Mondays 12:15 to 13:00. Let’s stop good food from being thrown away. Let’s share it instead.</desc>

