      <stop offset="0" stop-color="#F8F5EE"/>
      <stop offset="1" stop-color="#EDE9DF"/>
    </linearGradient>
    <clipPath id="illusClip">
      <rect x="70" y="200" width="760" height="320" rx="14"/>
    </clipPath>
  </defs>

